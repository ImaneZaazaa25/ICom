name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - tests

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Qodana Scan Backend'
        uses: JetBrains/qodana-action@v2025.3
        with:
          image: jetbrains/qodana-jvm-community:2025.3
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
          project-path: back-end